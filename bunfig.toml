# Bun configuration for the property management monorepo

[install]
# Use exact versions for reproducibility
exact = true
# Hoisted layout avoids node_modules/.bun symlinks (breaks Vercel serverless packaging).
linker = "hoisted"

[install.lockfile]
# Print the lockfile to the console
print = "yarn"

[run]
# Bun run configuration
bun = true


